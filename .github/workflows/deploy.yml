name: Deploy Client

on:
  push:
    branches:
      - uat         # push to uat branch → deploys to UAT stage
      - main        # push to main branch → deploys to Production stage

permissions:
  id-token: write   # required for OIDC token request
  contents: read

jobs:
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy UAT
        if: github.ref_name == 'uat'
        run: npx sst deploy --stage uat
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.UAT_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.UAT_SOCKET_URL }}
          NEXT_PUBLIC_CLOUDFRONT_URL: ${{ vars.UAT_CLOUDFRONT_URL }}

      - name: Deploy Production
        if: github.ref_name == 'main'
        run: npx sst deploy --stage production
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PROD_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.PROD_SOCKET_URL }}
          NEXT_PUBLIC_CLOUDFRONT_URL: ${{ vars.PROD_CLOUDFRONT_URL }}
